# Caviar SPA - nginx server configuration.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Container healthcheck target (does not depend on the SPA router).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Long-cache fingerprinted assets (Vite emits content-hashed filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every unknown path serves index.html so client-side
    # routing works on hard refresh / deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, so new deploys are picked up.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Baseline security headers for the static app shell.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Do not leak the nginx version.
    server_tokens off;
}
