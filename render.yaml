# Render blueprint for the Caviar backend on the NATIVE PYTHON runtime
# (not Docker).
#
# The build command installs Python deps and then runs render-build.sh, which
# downloads the Tectonic LaTeX compiler (a self-contained static binary) into
# the project's .render/ directory and pre-warms its resource bundle by
# compiling a document that exercises every font size/shape the approved
# templates use (\LARGE, \large, \bfseries, \itshape) so all Latin Modern
# variants are cached. Whatever the build writes under the source dir
# (/opt/render/project/src) is present at runtime.
#
# rootDir is backend/, so the source dir maps to backend/ and the vendored
# binary lives at /opt/render/project/src/.render/tectonic/tectonic.
#
# Secrets (DATABASE_URL, SUPABASE_*, OPENAI_API_KEY, JWT) are set in the Render
# dashboard, not committed here (sync:false).
services:
  - type: web
    name: caviar-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -U pip && pip install . && ./render-build.sh"
    startCommand: "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      # Pin Python 3.12: Render's native default is now 3.13, but the Kokoro
      # TTS dependency ([tts] extra) requires Python <3.13. 3.12 satisfies
      # Kokoro plus faster-whisper/ctranslate2 and the rest of the stack.
      # (backend/.python-version pins the same; this documents it in the
      # blueprint.) Patchless -> Render uses the latest 3.12.x.
      - key: PYTHON_VERSION
        value: "3.12"
      # Point the app at the Tectonic binary + cache vendored by
      # render-build.sh (rootDir=backend -> /opt/render/project/src).
      - key: TECTONIC_BINARY_PATH
        value: /opt/render/project/src/.render/tectonic/tectonic
      - key: TECTONIC_CACHE_DIR
        value: /opt/render/project/src/.render/tectonic-cache
      # The build pre-warms the full font set. If you ever see a runtime
      # "TFM file ... not found", set this to "false" so runtime compiles can
      # fetch any missing bundle resource from Tectonic's CDN on demand.
      - key: TECTONIC_ONLY_CACHED
        value: "false"
      # Dashboard-managed secrets (set in Render, never in git):
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_JWKS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
